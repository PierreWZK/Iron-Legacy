server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Fichiers versionnés par Vite : cache long. Un ancien fichier (onglet ouvert avant un déploiement) donne un vrai 404.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # index.html jamais mis en cache : après un déploiement, le navigateur charge les nouveaux fichiers.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
